# =============================================================================
# REDIS SECURE PRODUCTION CONFIGURATION
# =============================================================================
#
# High-security Redis configuration enforcing TLS, ACLs, and resource limits.
# Designed for production environments with encrypted connections only.
# -----------------------------------------------------------------------------

# --- Network and TLS Security ---
#
# Disable non-TLS port to enforce encrypted connections exclusively
port 0

# Enable TLS on standard Redis port for all client connections
tls-port 6379

# Paths to TLS certificate files (must be readable by Redis process)
tls-cert-file /usr/local/etc/redis/redis.crt
tls-key-file /usr/local/etc/redis/redis.key
tls-ca-cert-file /usr/local/etc/redis/ca.crt

# Require client certificate authentication for mutual TLS
tls-auth-clients yes

# Restrict to modern, secure TLS protocol versions only
tls-protocols "TLSv1.2 TLSv1.3"

# Limit to strong, forward-secrecy cipher suites only
tls-ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"

# Prefer server cipher order for maximum security
tls-prefer-server-ciphers yes

# --- User and Authentication Security (ACL) ---
#
# Disable default user (full access) for security hardening
user default off

# Production user with strong password and minimal required permissions
# Replace password with 32+ character randomly generated password
# Current permissions (+@all) grant full access - consider narrowing to:
# +@read +@write +@list +@set +@hash for cache-only use cases
user redis_vovo_3v7m0j on >Spr0zWPDuOKtibCbu4NW ~* +@all

# --- Resource Management and Stability ---
#
# Maximum concurrent client connections (adjust based on server capacity)
maxclients 10000

# Memory limit with no-eviction policy (rejects writes when full)
# 512MB example - adjust based on available RAM and workload
maxmemory 512mb
maxmemory-policy noeviction

# Client output buffer limits to prevent memory exhaustion
# normal: unlimited (default)
# slave: 256mb hard / 64mb soft / 60s timeout
# pubsub: 32mb hard / 8mb soft / 60s timeout
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# --- Logging and Monitoring ---
#
# Log level: notice (informational + warnings + errors)
loglevel notice

# Log to stdout (ideal for containers/Docker)
# For bare-metal: uncomment and set path -> logfile "/var/log/redis/redis.log"
logfile ""

# --- Persistence Configuration (Optional) ---
#
# RDB snapshots - uncomment for periodic durable backups
# save 900 1      # Save if 1 key changed in 15 minutes
# save 300 10     # Save if 10 keys changed in 5 minutes  
# save 60 10000   # Save if 10000 keys changed in 1 minute

# AOF persistence - uncomment for maximum durability
# appendonly yes
# appendfsync everysec  # Balance between performance and durability
